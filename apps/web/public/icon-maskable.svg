<!-- Maskable: the mark sits inside the 80% safe zone, so a circular or squircle
     mask on Android cannot clip it. Same glyph, more padding — that is the whole difference. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Passbook">
  <rect width="512" height="512" fill="#0A0A0A"/>
  <rect x="176" y="176" width="160" height="160" fill="#C8F57F" transform="rotate(45 256 256)"/>
</svg>
