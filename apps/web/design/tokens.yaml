# Passbook design tokens — STUDIO direction. [RATIFIED Abu 2026-08-28] Every colour below is
# lifted verbatim from the ratified design prototype ("Passbook Studio", exported 2026-08-27 —
# Anton display type, mint/black brutalist palette, top pill nav, inverted balance panel) and
# mapped onto this sheet's existing semantic names. Dark is the PRIMARY theme — the prototype's
# `:root` block; light is its `[data-pbt="light"]` block. The Uniswap SPORE palette is superseded
# whole. One deliberate role change: accent3 (the CTA fill) is now the accent itself rather than
# an ink alias — Studio's primary buttons are gold with near-black text, and `.cta`'s
# `color: ground` produces exactly that in both modes.
colors:
  light:
    ground: "#E7E6E1"            # [STUDIO bg0-light] page background — warm bone, never white
    raised: "#F4F3EF"            # [STUDIO bg1-light] panels one step up from the page
    raisedHovered: "#EFEEE9"     # between bg1 and bg2 — hover is a half-step, not a jump
    inset: "#DBDAD4"             # [STUDIO bg2-light] wells, inputs at rest
    insetHovered: "#CECDC6"      # [STUDIO bg3-light]
    surface3: "rgba(10,10,10,0.12)"        # [STUDIO line-light] borders + hairlines
    surface3Hovered: "rgba(10,10,10,0.24)" # [STUDIO line2-light]
    surface3Solid: "#CECDC6"     # [STUDIO bg3-light]
    surface4: "rgba(244,243,239,0.64)"     # translucent overlay layer over bg1
    scrim: "rgba(20,20,18,0.5)"  # [STUDIO scrim-light]
    neutral1: "#0A0A0A"          # [STUDIO ink-light]
    neutral1Hovered: "rgba(10,10,10,0.83)"
    neutral2: "#55544F"          # [STUDIO ink2-light] secondary text
    neutral2Hovered: "rgba(10,10,10,0.83)"
    # neutral3 stays a SECONDARY cue (see notYetReal below) — same ruling as before, structure
    # carries "not yet real", never the grey alone.
    neutral3: "#85847E"          # [STUDIO ink3-light]
    neutral3Hovered: "#55544F"
    accent1: "#3F6B12"           # [STUDIO gold-light] the lime, darkened to read on bone
    accent1Hovered: "#2E500A"    # [STUDIO goldB-light]
    accent2: "rgba(63,107,18,0.13)"        # [STUDIO goldD-light] filled-accent tint
    accent2Hovered: "rgba(63,107,18,0.20)"
    accent2Solid: "#DCE1D2"      # goldD composited over bg1
    accent3: "#3F6B12"           # CTA fill — gold; `.cta` text is `ground`, Studio's onGold
    settled: "#2F6B45"           # [STUDIO sage-light]
    settledHovered: "#245536"
    settledTint: "rgba(47,107,69,0.12)"    # [STUDIO sageD-light]
    exposed: "#6E5A05"           # [STUDIO warn-light]
    exposedHovered: "#574704"
    exposedTint: "rgba(110,90,5,0.13)"     # [STUDIO warnD-light]
    irreversible: "#A33A55"      # [STUDIO red-light] a rose, not a fire alarm
    irreversibleHovered: "#832E44"
    irreversibleTint: "rgba(163,58,85,0.10)" # [STUDIO redD-light]
  dark:
    ground: "#0A0A0A"            # [STUDIO bg0] near-black, never #000
    raised: "#151515"            # [STUDIO bg1] panels one step up from the page
    raisedHovered: "#1D1D1D"     # [STUDIO bg2]
    inset: "#1D1D1D"             # [STUDIO bg2] wells read a half-step down from raised
    insetHovered: "#2A2A2A"      # [STUDIO bg3]
    surface3: "rgba(240,239,234,0.10)"     # [STUDIO line]
    surface3Hovered: "rgba(240,239,234,0.20)" # [STUDIO line2]
    surface3Solid: "#2A2A2A"     # [STUDIO bg3]
    surface4: "rgba(240,239,234,0.20)"
    scrim: "rgba(0,0,0,0.72)"    # [STUDIO scrim]
    neutral1: "#F1F0EB"          # [STUDIO ink] bone white, never #fff
    neutral1Hovered: "rgba(241,240,235,0.85)"
    neutral2: "#A3A29C"          # [STUDIO ink2]
    neutral2Hovered: "rgba(241,240,235,0.85)"
    neutral3: "#6D6C67"          # [STUDIO ink3]
    neutral3Hovered: "#8B8A84"
    accent1: "#C8F57F"           # [STUDIO gold] the lime — the one branded colour
    accent1Hovered: "#DAFA9F"    # [STUDIO goldB]
    accent2: "rgba(200,245,127,0.12)"      # [STUDIO goldD] filled-accent tint
    accent2Hovered: "rgba(200,245,127,0.20)"
    accent2Solid: "#2A3022"      # goldD composited over bg1
    accent3: "#C8F57F"           # CTA fill — gold; `.cta` text is `ground`, Studio's onGold
    settled: "#8FD9A6"           # [STUDIO sage]
    settledHovered: "#A8E4B8"
    settledTint: "rgba(143,217,166,0.12)"  # [STUDIO sageD]
    exposed: "#F2DC4E"           # [STUDIO warn]
    exposedHovered: "#F7E87A"
    exposedTint: "rgba(242,220,78,0.12)"   # [STUDIO warnD]
    irreversible: "#F2A0B4"      # [STUDIO red] a rose, not a fire alarm
    irreversibleHovered: "#F7B8C7"
    irreversibleTint: "rgba(242,160,180,0.12)" # [STUDIO redD]
typography:
  # [RATIFIED Abu 2026-08-28] The STUDIO triad, delivered as fontsource packages:
  #   Archivo (@fontsource-variable/archivo@5.3.0, wght axis 100–900) — every sentence
  #   Anton (@fontsource/anton@5.3.0, single 400 cut) — display headings, ALL-CAPS, never body
  #   Space Mono (@fontsource/space-mono@5.3.0, 400+700) — money, hashes, kickers, machine facts
  # Space Mono is monospaced so a money column cannot shift; `tabular-nums` stays on the numeric
  # primitive as insurance for the system fallback only.
  family: "Archivo"
  familyFallback: "Inter"        # one-line swap; loads only for readers with it installed
  display: "Anton"               # emitted as --font-display; Archivo Variable is its fallback
  mono: "'Space Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', 'Segoe UI Mono', 'Roboto Mono', 'Courier New', monospace"
  weights: [400, 600, 700]       # Studio's axis positions: book text, semibold buttons, bold nav
  numerals: tabular
  scale:
    # The display ladder is NEW with Studio: Anton at 400, uppercase at the call site, leading
    # ~0.9 of size snapped to the 4px grid. Responsive pairs at call sites (display2 → xl:display1)
    # stand in for the prototype's clamp(), which the step grammar cannot carry.
    displayHero: "76/64 0.004em" # the wallet balance figure at desktop
    display1: "62/56 0.004em"    # page titles at desktop
    display2: "44/40 0.004em"    # page titles at phone width
    display3: "29/28 0.004em"    # panel titles (Chat list, The record)
    display4: "19/20 0.02em"     # card headings in display voice
    heading1: "52/56 -0.02em"    # exists in scale; Archivo headings cap at heading2 in-app
    heading2: "36/40 -0.01em"
    heading3: "24/28 -0.005em"
    subheading1: "18/24"
    subheading2: "16/24"
    body1: "18/24"
    body2: "16/24"
    body3: "14/20"
    body4: "12/16"
    mono: "12/16"
    kicker: "11/16 0.16em"       # the mono section kickers — "01 — account", uppercase
    navLabel: "11/16 0.12em @700" # pill-nav labels, uppercase bold
    buttonLabel1: "18/24 @600"
    buttonLabel2: "16/24 @600"
    buttonLabel3: "14/20 @600"
    buttonLabel4: "12/16 @600"
rounded:
  none: 0
  badge: 6
  small: 8
  control: 12       # small controls, text inputs, icon chips
  card: 16          # every card, sheet, modal, re-consent row
  large: 20         # large controls, amount-input container
  xl: 24
  hero: 32
  pill: 9999        # pills, grab handles, skeleton bars
spacing:
  scale: [0, 1, 2, 4, 6, 8, 12, 16, 18, 20, 24, 28, 32, 36, 40, 48, 60]
  padding: [6, 8, 12, 16, 20, 24, 36]
  gap: [4, 8, 12, 16, 20, 24, 32, 36]
  hairlineOnly: [1, 2]
  breakpoints: [360, 380, 450, 640, 768, 1024, 1280, 1536]
components:
  button:
    small:  { px: 12, py: 8,  radius: 12, gap: 8 }
    medium: { px: 16, py: 12, radius: 16, gap: 8 }
    large:  { px: 20, py: 16, radius: 20, gap: 12 }   # primary pipeline actions
    primaryFill: accent3        # ink, not brand
    focus: "1px solid outline, 2px offset, variant's Hovered token; scale 0.98×0.905"
    hitSlop: "runtime to 44/48px minimums"
  modal:
    maxWidth: 420
    width: "calc(100vw - 32px)"
    maxHeight: "calc(100vh - 32px)"
    radius: 16
    border: "1px surface3"
    padding: "24px 16px (px24 py16)"
    sheetBelow: 640             # same children tree, top corners r16, handle 32×4 pill neutral3
    popoverSheetBelow: 450
  input:
    radius: 12
    padding: "16/12"
    restFill: inset
    focusFill: raised           # focus inverts the container + 1px surface3 border
  card:
    fill: raised
    radius: 16
    border: "1px surface3"
    padding: 16
    shadow: short
  chip:
    radius: 6
    border: "1px status solid"
    fill: "status tint"
    label: "always full text contrast, never the status color"
  activityRow: { radius: 16, py: 8, gap: 12, icon: 40 }
  chatBubble: { radius: 18, padding: "8/12", runGap: "6→1px", facingCorner: 4 }  # [SIG]
  # [6-7] The signature component (DESIGN §7.5 "Container recipe [UNI InlineCard via 08 §5.1]").
  # Its numbers were prose in the body and nowhere a build could read them; they live here because
  # this is where component recipes live, and `scripts/assert-design-shipped.mjs` holds the SHIPPED
  # stylesheet to them rather than to a value retyped into index.css.
  disclosure:
    fill: inset
    radius: 16
    padding: 12
    gap: 12
    # AUTHORITY, NOT YET CONSUMED. D27's panel anatomy puts an icon chip beside the headline; story
    # 6.7 ships no icon anywhere (§7.5 also bans padlock and shield iconography, so whatever lands
    # here will not be a lock). Recorded now because the recipe is the authority's and losing it
    # costs a re-derivation later — but nothing in `index.css` reads it today, and the build gate
    # deliberately does not pin it. Delete this comment when a chip actually renders.
    iconChip: { radius: 12, padding: 8 }
    body: "forced neutral2 body3"   # headline takes the semantic colour; the body never does
  # [6-7] The visibility-matrix cell marker (DESIGN §7.5 part 2, §2.3's icon-and-word rule).
  # Ten is deliberately off the spacing scale — it is a mark, not a space, and the scale is the
  # design authority's own list. The stylesheet writes it once and the gate pins it to this line.
  visibilityDot:
    size: 10
    states: [sees, hidden, conditional, absent]
    encoding: "fill · hollow · half · dash — colour is the second channel, never the first"
  # [6-7b] The digit machine (DESIGN:242 "Digit roll: 180ms/digit, 40ms stagger"). DESIGN:242 is the
  # only line in the corpus carrying the full contract; EXPERIENCE:138 has the stagger but not the
  # duration. Both numbers live here because this is the only place a build can read them: the
  # stylesheet writes each one once and `assert-design-shipped.mjs` resolves the SHIPPED sheet
  # against these lines. The MODEL (`packages/protocol/src/odometer.ts`) deliberately holds neither —
  # it carries a stagger ORDINAL and lets CSS multiply, so there is no third copy to drift.
  odometer:
    perDigitMs: 180           # emitted as --transition-duration-quicker, which is already 180ms
    staggerMs: 40             # off the duration scale; a stagger STEP is not a transition duration
    rationedTo: [anonymity-set size, block counter]   # DESIGN:242 — widening is Abu's call only
# [RATIFIED Abu 2026-08-25] "not yet real" is carried by structure, not by grey alone.
notYetReal:
  encoding: dotted-underline    # 1px dotted, currentColor at 0.45 — survives greyscale and CVD
  colorCue: neutral3            # secondary only; a run may never rely on the grey by itself
  appliesTo: [immature notes, block counts, timestamps, indicative values, quoted-not-final amounts]

# Motion. Eleven durations over FIVE distinct curves. The source text wrote "same" for a curve
# repeated from the line above — resolved verbatim here, because "same" emitted into CSS is an
# invalid value that browsers drop silently, leaving the transition at its default ease.
# Curve names are 6-2's call, recorded here so component code never writes a bezier.
easings:
  simple:    "ease-in-out"
  snap:      "cubic-bezier(0.17,0.67,0.45,1)"        # chrome: enters/exits, sheets, buttons
  glide:     "cubic-bezier(0.25,0.46,0.45,0.94)"     # content: crossfades, slot swaps
  settle:    "cubic-bezier(0.25,0.1,0.25,1)"         # scrims and long overlays
  attention: "cubic-bezier(0.17,0.17,0,1)"           # [SIG] the one 1.2s cue
  # INDETERMINATE MOTION ONLY. Every curve above is a curve on purpose — chrome and content should
  # ease. A CONTINUOUSLY ROTATING ring must not: an eased revolution visibly accelerates and
  # decelerates once per turn, and that cadence reads as progress events on a computation we do not
  # own (§7.7's honesty split). Never reach for this on a transition.
  linear:    "linear"
motion:
  simple:        { duration: 80,   easing: simple }
  fastExit:      { duration: 80,   easing: snap }
  fast:          { duration: 100,  easing: snap }
  fastExitHeavy: { duration: 100,  easing: snap }
  fastHeavy:     { duration: 120,  easing: snap }
  stiff:         { duration: 150,  easing: snap }
  quicker:       { duration: 180,  easing: glide }
  quick:         { duration: 200,  easing: glide }
  quickLong:     { duration: 300,  easing: glide }
  lazy:          { duration: 500,  easing: settle }
  attention:     { duration: 1200, easing: attention }   # [SIG]
  # The hosted prover's indeterminate ring. §7.7, EXPERIENCE §4.2 and the §5 state table all name
  # "750ms linear" in prose; this is that value transcribed into the frontmatter the generator
  # reads, not a new preference.
  ring:          { duration: 750,  easing: linear }
  stagger: 40
  properties: "transform + opacity only; never color, never layout height"

# [STUDIO] The prototype ships one glow — `0 24px 80px` under every sheet and modal — and that is
# `large` verbatim in both modes. `short`/`medium` are the same family scaled down. Dark is NOT a
# tint of light: near-black panels on a near-black page need deep large-radius shadows to read as
# elevation at all.
shadows:
  light:
    short:  "0 1px 4px 0 rgba(40,40,36,0.08)"
    medium: "0 10px 28px -6px rgba(40,40,36,0.16)"
    large:  "0 24px 80px rgba(40,40,36,0.24)"
  dark:
    short:  "0 1px 4px 0 rgba(0,0,0,0.35)"
    medium: "0 12px 32px -6px rgba(0,0,0,0.5)"
    large:  "0 24px 80px rgba(0,0,0,0.6)"
