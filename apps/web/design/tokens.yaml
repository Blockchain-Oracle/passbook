# Passbook design tokens — SPORE direction. [RATIFIED Abu 2026-08-27] Every colour below is a
# published Uniswap interface value, lifted verbatim from
# reference/uniswap-interface/packages/tailwind/css/theme.css (their live Spore generation) and
# mapped onto this sheet's semantic names. No value is invented; where Uniswap reuses one value
# across roles (accent3 = neutral1), this sheet reuses it identically. The earlier warm-paper
# "LEDGER/D27" palette is superseded whole — Abu's ruling on plan review: "just use the Uniswap
# color for both light mode and dark mode."
colors:
  light:
    ground: "#ffffff"            # [UNI surface1-light] page background
    raised: "#ffffff"            # [UNI surface1-light] cards are white-on-white behind a surface3 border
    raisedHovered: "#fcfcfc"     # [UNI surface1-hovered-light]
    inset: "#f9f9f9"             # [UNI surface2-light] wells, inputs at rest, code areas
    insetHovered: "#f2f2f2"      # [UNI surface2-hovered-light]
    surface3: "rgba(19,19,19,0.08)"        # [UNI surface3-light] borders + nested fills
    surface3Hovered: "rgba(19,19,19,0.10)" # [UNI surface3-hovered-light]
    surface3Solid: "#f2f2f2"     # [UNI surface3-solid-light]
    surface4: "rgba(255,255,255,0.64)"     # [UNI surface4-light] translucent overlay layer
    scrim: "rgba(0,0,0,0.60)"    # [UNI scrim]
    neutral1: "#131313"          # [UNI neutral1-light] primary ink — never #000
    neutral1Hovered: "rgba(19,19,19,0.83)" # [UNI neutral1-hovered-light]
    neutral2: "rgba(19,19,19,0.63)"        # [UNI neutral2-light] secondary text
    neutral2Hovered: "rgba(19,19,19,0.83)" # [UNI neutral2-hovered-light]
    # neutral3 stays a SECONDARY cue (see notYetReal below): Uniswap's 0.35 alpha does not meet AA
    # either — same ruling as before, structure carries "not yet real", never the grey alone.
    neutral3: "rgba(19,19,19,0.35)"        # [UNI neutral3-light]
    neutral3Hovered: "rgba(19,19,19,0.55)" # [UNI neutral3-hovered-light]
    accent1: "#ff37c7"           # [UNI accent1] the pink — same value both modes, no per-mode flip
    accent1Hovered: "#e500a5"    # [UNI accent1-hovered]
    accent2: "rgba(255,55,199,0.08)"       # [UNI accent2-light]
    accent2Hovered: "rgba(255,55,199,0.12)" # [UNI accent2-hovered-light]
    accent2Solid: "#fff3fc"      # [UNI accent2-solid-light]
    accent3: "#131313"           # [UNI accent3-light] ink alias — most CTAs are ink, not brand
    settled: "#0c8911"           # [UNI success-light]
    settledHovered: "#06742c"    # [UNI success-hovered-light]
    settledTint: "rgba(15,194,68,0.06)"    # [UNI success-secondary-light]
    exposed: "#996f01"           # [UNI warning-light]
    exposedHovered: "#7a5801"    # [UNI warning-hovered-light]
    exposedTint: "rgba(255,191,23,0.10)"   # [UNI warning-secondary-light]
    irreversible: "#e10f0f"      # [UNI critical-light]
    irreversibleHovered: "#bf0d0d"         # [UNI critical-hovered-light]
    irreversibleTint: "rgba(255,0,0,0.05)" # [UNI critical-secondary-light]
  dark:
    ground: "#131313"            # [UNI surface1-dark]
    raised: "#1f1f1f"            # [UNI surface2-dark] panels one step up from the page
    raisedHovered: "#242424"     # [UNI surface2-hovered-dark]
    inset: "#1a1a1a"             # [UNI surface1-hovered-dark] wells read a half-step DOWN from raised
    insetHovered: "#242424"      # [UNI surface2-hovered-dark] — deliberate value reuse, roles differ
    surface3: "rgba(255,255,255,0.12)"     # [UNI surface3-dark]
    surface3Hovered: "rgba(255,255,255,0.16)" # [UNI surface3-hovered-dark]
    surface3Solid: "#393939"     # [UNI surface3-solid-dark]
    surface4: "rgba(255,255,255,0.20)"     # [UNI surface4-dark]
    scrim: "rgba(0,0,0,0.60)"    # [UNI scrim]
    neutral1: "#ffffff"          # [UNI neutral1-dark]
    neutral1Hovered: "rgba(255,255,255,0.85)" # [UNI neutral1-hovered-dark]
    neutral2: "rgba(255,255,255,0.65)"     # [UNI neutral2-dark]
    neutral2Hovered: "rgba(255,255,255,0.85)" # [UNI neutral2-hovered-dark]
    neutral3: "rgba(255,255,255,0.38)"     # [UNI neutral3-dark]
    neutral3Hovered: "rgba(255,255,255,0.58)" # [UNI neutral3-hovered-dark]
    accent1: "#ff37c7"           # [UNI accent1] identical in both modes, exactly as Uniswap ships it
    accent1Hovered: "#e500a5"    # [UNI accent1-hovered]
    accent2: "rgba(255,55,199,0.08)"       # [UNI accent2-dark]
    accent2Hovered: "rgba(255,55,199,0.12)" # [UNI accent2-hovered-dark]
    accent2Solid: "#261621"      # [UNI accent2-solid-dark]
    accent3: "#ffffff"           # [UNI accent3-dark] ink alias
    settled: "#21c95e"           # [UNI success-dark]
    settledHovered: "#15863c"    # [UNI success-hovered-dark] — Uniswap hovers DARKEN in dark mode; kept
    settledTint: "rgba(33,201,94,0.12)"    # [UNI success-secondary-dark]
    exposed: "#ffbf17"           # [UNI warning-dark]
    exposedHovered: "#ffdd0d"    # [UNI warning-hovered-dark]
    exposedTint: "rgba(255,191,23,0.08)"   # [UNI warning-secondary-dark]
    irreversible: "#ff593c"      # [UNI critical-dark]
    irreversibleHovered: "#ff401f"         # [UNI critical-hovered-dark]
    irreversibleTint: "rgba(255,89,60,0.12)" # [UNI critical-secondary-dark]
typography:
  # [RATIFIED Abu 2026-08-25] IBM Plex Sans, delivered as @fontsource-variable/ibm-plex-sans@5.3.0.
  # Measured in Chromium at 24px against the shipped woff2: 485 and 535 are both live axis positions
  # (specimen advances 197.578px / 199.125px), and the digit advance is INVARIANT across them —
  # a money column cannot shift when a value changes weight.
  family: "IBM Plex Sans"
  familyFallback: "Inter"        # one-line swap; Inter's "490/540" is measurably identical to 485/535
  mono: "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, 'Cascadia Mono', 'Segoe UI Mono', 'Roboto Mono', 'Courier New', monospace"  # [UNI] kept — Plex Mono priced but not adopted
  weights: [485, 535]            # variable-axis positions [UNI]. Plex's axis CLAMPS above 700:
                                 # a wght token >700 is silently ignored, so the lint forbids one.
  # Plex ships NO tnum feature and needs none: its digits are 600/1000em at EVERY weight,
  # unconditionally. `font-variant-numeric: tabular-nums` measures a 0.000px no-op here and stays on
  # the numeric primitive only as insurance for the Inter fallback. The consequence, accepted with
  # the ruling: prose can never opt OUT to proportional numerals. Every number sets tabular, always.
  numerals: tabular
  scale:
    heading1: "52/56 -0.02em"    # exists in scale; in-app max is heading2 (08 §7.2)
    heading2: "36/40 -0.01em"
    heading3: "24/28 -0.005em"
    subheading1: "18/24"
    subheading2: "16/24"
    body1: "18/24"
    body2: "16/24"
    body3: "14/20"
    body4: "12/16"
    mono: "12/16"
    buttonLabel1: "18/24 @535"
    buttonLabel2: "16/24 @535"
    buttonLabel3: "14/20 @535"
    buttonLabel4: "12/16 @535"
rounded:
  none: 0
  badge: 6
  small: 8
  control: 12       # small controls, text inputs, icon chips
  card: 16          # every card, sheet, modal, re-consent row
  large: 20         # large controls, amount-input container
  xl: 24
  hero: 32
  pill: 9999        # pills, grab handles, skeleton bars
spacing:
  scale: [0, 1, 2, 4, 6, 8, 12, 16, 18, 20, 24, 28, 32, 36, 40, 48, 60]
  padding: [6, 8, 12, 16, 20, 24, 36]
  gap: [4, 8, 12, 16, 20, 24, 32, 36]
  hairlineOnly: [1, 2]
  breakpoints: [360, 380, 450, 640, 768, 1024, 1280, 1536]
components:
  button:
    small:  { px: 12, py: 8,  radius: 12, gap: 8 }
    medium: { px: 16, py: 12, radius: 16, gap: 8 }
    large:  { px: 20, py: 16, radius: 20, gap: 12 }   # primary pipeline actions
    primaryFill: accent3        # ink, not brand
    focus: "1px solid outline, 2px offset, variant's Hovered token; scale 0.98×0.905"
    hitSlop: "runtime to 44/48px minimums"
  modal:
    maxWidth: 420
    width: "calc(100vw - 32px)"
    maxHeight: "calc(100vh - 32px)"
    radius: 16
    border: "1px surface3"
    padding: "24px 16px (px24 py16)"
    sheetBelow: 640             # same children tree, top corners r16, handle 32×4 pill neutral3
    popoverSheetBelow: 450
  input:
    radius: 12
    padding: "16/12"
    restFill: inset
    focusFill: raised           # focus inverts the container + 1px surface3 border
  card:
    fill: raised
    radius: 16
    border: "1px surface3"
    padding: 16
    shadow: short
  chip:
    radius: 6
    border: "1px status solid"
    fill: "status tint"
    label: "always full text contrast, never the status color"
  activityRow: { radius: 16, py: 8, gap: 12, icon: 40 }
  chatBubble: { radius: 18, padding: "8/12", runGap: "6→1px", facingCorner: 4 }  # [SIG]
  # [6-7] The signature component (DESIGN §7.5 "Container recipe [UNI InlineCard via 08 §5.1]").
  # Its numbers were prose in the body and nowhere a build could read them; they live here because
  # this is where component recipes live, and `scripts/assert-design-shipped.mjs` holds the SHIPPED
  # stylesheet to them rather than to a value retyped into index.css.
  disclosure:
    fill: inset
    radius: 16
    padding: 12
    gap: 12
    # AUTHORITY, NOT YET CONSUMED. D27's panel anatomy puts an icon chip beside the headline; story
    # 6.7 ships no icon anywhere (§7.5 also bans padlock and shield iconography, so whatever lands
    # here will not be a lock). Recorded now because the recipe is the authority's and losing it
    # costs a re-derivation later — but nothing in `index.css` reads it today, and the build gate
    # deliberately does not pin it. Delete this comment when a chip actually renders.
    iconChip: { radius: 12, padding: 8 }
    body: "forced neutral2 body3"   # headline takes the semantic colour; the body never does
  # [6-7] The visibility-matrix cell marker (DESIGN §7.5 part 2, §2.3's icon-and-word rule).
  # Ten is deliberately off the spacing scale — it is a mark, not a space, and the scale is the
  # design authority's own list. The stylesheet writes it once and the gate pins it to this line.
  visibilityDot:
    size: 10
    states: [sees, hidden, conditional, absent]
    encoding: "fill · hollow · half · dash — colour is the second channel, never the first"
  # [6-7b] The digit machine (DESIGN:242 "Digit roll: 180ms/digit, 40ms stagger"). DESIGN:242 is the
  # only line in the corpus carrying the full contract; EXPERIENCE:138 has the stagger but not the
  # duration. Both numbers live here because this is the only place a build can read them: the
  # stylesheet writes each one once and `assert-design-shipped.mjs` resolves the SHIPPED sheet
  # against these lines. The MODEL (`packages/protocol/src/odometer.ts`) deliberately holds neither —
  # it carries a stagger ORDINAL and lets CSS multiply, so there is no third copy to drift.
  odometer:
    perDigitMs: 180           # emitted as --transition-duration-quicker, which is already 180ms
    staggerMs: 40             # off the duration scale; a stagger STEP is not a transition duration
    rationedTo: [anonymity-set size, block counter]   # DESIGN:242 — widening is Abu's call only
# [RATIFIED Abu 2026-08-25] "not yet real" is carried by structure, not by grey alone.
notYetReal:
  encoding: dotted-underline    # 1px dotted, currentColor at 0.45 — survives greyscale and CVD
  colorCue: neutral3            # secondary only; a run may never rely on the grey by itself
  appliesTo: [immature notes, block counts, timestamps, indicative values, quoted-not-final amounts]

# Motion. Eleven durations over FIVE distinct curves. The source text wrote "same" for a curve
# repeated from the line above — resolved verbatim here, because "same" emitted into CSS is an
# invalid value that browsers drop silently, leaving the transition at its default ease.
# Curve names are 6-2's call, recorded here so component code never writes a bezier.
easings:
  simple:    "ease-in-out"
  snap:      "cubic-bezier(0.17,0.67,0.45,1)"        # chrome: enters/exits, sheets, buttons
  glide:     "cubic-bezier(0.25,0.46,0.45,0.94)"     # content: crossfades, slot swaps
  settle:    "cubic-bezier(0.25,0.1,0.25,1)"         # scrims and long overlays
  attention: "cubic-bezier(0.17,0.17,0,1)"           # [SIG] the one 1.2s cue
  # INDETERMINATE MOTION ONLY. Every curve above is a curve on purpose — chrome and content should
  # ease. A CONTINUOUSLY ROTATING ring must not: an eased revolution visibly accelerates and
  # decelerates once per turn, and that cadence reads as progress events on a computation we do not
  # own (§7.7's honesty split). Never reach for this on a transition.
  linear:    "linear"
motion:
  simple:        { duration: 80,   easing: simple }
  fastExit:      { duration: 80,   easing: snap }
  fast:          { duration: 100,  easing: snap }
  fastExitHeavy: { duration: 100,  easing: snap }
  fastHeavy:     { duration: 120,  easing: snap }
  stiff:         { duration: 150,  easing: snap }
  quicker:       { duration: 180,  easing: glide }
  quick:         { duration: 200,  easing: glide }
  quickLong:     { duration: 300,  easing: glide }
  lazy:          { duration: 500,  easing: settle }
  attention:     { duration: 1200, easing: attention }   # [SIG]
  # The hosted prover's indeterminate ring. §7.7, EXPERIENCE §4.2 and the §5 state table all name
  # "750ms linear" in prose; this is that value transcribed into the frontmatter the generator
  # reads, not a new preference.
  ring:          { duration: 750,  easing: linear }
  stagger: 40
  properties: "transform + opacity only; never color, never layout height"

# Lifted verbatim from §5 prose (lines 294–301), which was the only place they existed. The
# generator needs them in the frontmatter, and dark is NOT a tint of light here — dark shadows do
# 4–12x more work because #1C1813 on #14110D is too weak to read as elevation on its own.
shadows:
  light:
    short:  "0 1px 6px 2px rgba(19,19,19,0.03), 0 1px 2px 0 rgba(19,19,19,0.02)"
    medium: "0 6px 12px -3px rgba(19,19,19,0.04), 0 2px 5px -2px rgba(19,19,19,0.03)"
    large:  "0 10px 20px -5px rgba(19,19,19,0.05), 0 4px 12px -3px rgba(19,19,19,0.04)"
  dark:
    short:  "0 1px 3px 0 rgba(0,0,0,0.12), 0 1px 2px 0 rgba(0,0,0,0.24)"
    medium: "0 10px 15px -3px rgba(0,0,0,0.54), 0 4px 6px -2px rgba(0,0,0,0.40)"
    large:  "0 16px 24px -6px rgba(0,0,0,0.60), 0 8px 12px -4px rgba(0,0,0,0.48)"
