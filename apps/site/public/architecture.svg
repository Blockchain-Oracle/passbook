  <circle cx="154" cy="314" r="14" fill="#E04708"/><text x="154" y="318" fill="#FBF4EC">2</text>
  <circle cx="348" cy="366" r="14" fill="#E04708"/><text x="348" y="370" fill="#FBF4EC">3</text>
  <circle cx="742" cy="332" r="14" fill="#E04708"/><text x="742" y="336" fill="#FBF4EC">4</text>
  <circle cx="1130" cy="126" r="14" fill="#E04708"/><text x="1130" y="130" fill="#FBF4EC">5</text>
</g>
