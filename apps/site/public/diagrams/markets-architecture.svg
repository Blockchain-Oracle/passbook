<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="markets-title markets-desc">
  <title id="markets-title">Markets architecture</title>
  <desc id="markets-desc">Live market and Pragma reads feed a reviewed bearer bet. The STRK20 pool funds the Markets contract, which records a public commitment and later returns a cash-out, win, or refund to a new pool note.</desc>
  <defs>
    <marker id="markets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#E04708" /></marker>
    <marker id="markets-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#F2DC4E" /></marker>
    <style>
      .title{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#F1F0EB}.lane{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#F1F0EB}.head{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F1F0EB}.copy{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#A3A29C}.bright{fill:#F1F0EB}.accent{fill:#E04708}.warn{fill:#F2DC4E}.box{fill:#151515;stroke:#343434}.step{fill:#E04708}.step-text{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#FBF4EC;text-anchor:middle}.arrow{fill:none;stroke:#E04708;stroke-width:2;marker-end:url(#markets-arrow)}.public{fill:none;stroke:#F2DC4E;stroke-width:2;marker-end:url(#markets-yellow)}.read{fill:none;stroke:#77746D;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#markets-arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#0A0A0A" />
  <rect x="34" y="28" width="38" height="38" rx="9" fill="#C53603" />
  <path d="M46 47h20M50 38l12 18M62 38 50 56M60 43l6 4-6 4" fill="none" stroke="#F1F0EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="88" y="53" class="title">MARKETS · LIVE READ → BEARER POSITION → POOL NOTE</text>
  <text x="88" y="73" class="copy">Standing windows use Pragma. The amount, side, timing, odds movement, commitment and transaction submitter are public.</text>

  <rect x="34" y="102" width="1132" height="116" rx="12" class="box" />
  <text x="52" y="132" class="lane">FREE READ LANE · NO TRANSACTION</text>
  <circle cx="58" cy="169" r="14" class="step"/><text x="58" y="173" class="step-text">1</text>
  <text x="82" y="166" class="head">TanStack Query combines Markets state, chain events and Pragma prices</text>
  <text x="82" y="188" class="copy">current + previous series windows · custom markets · public tape · house float · live quote_bet</text>
  <text x="82" y="207" class="copy warn">An unopened standing window is only a computed id. Its first bet creates it and locks the oracle line.</text>
  <path d="M770 168H1128" class="read" />

  <rect x="34" y="252" width="252" height="352" rx="12" class="box" />
  <text x="52" y="282" class="lane">BROWSER + ACCOUNT</text>
  <circle cx="58" cy="323" r="14" class="step"/><text x="58" y="327" class="step-text">2</text>
  <text x="82" y="320" class="head">Plan the position</text>
  <text x="52" y="354" class="copy">choose window · Over / Under</text>
  <text x="52" y="374" class="copy">read tickets, vig and payout</text>
  <text x="52" y="394" class="copy">mint secret → commitment</text>
  <text x="52" y="414" class="copy warn">store secret before broadcast</text>
  <circle cx="58" cy="463" r="14" class="step"/><text x="58" y="467" class="step-text">3</text>
  <text x="82" y="460" class="head">Review + submit</text>
  <text x="52" y="494" class="copy">covered or self-submitted</text>
  <text x="52" y="514" class="copy">proof at latest − 10</text>
  <text x="52" y="534" class="copy">one transaction at a time</text>
  <path d="M286 430H330" class="arrow" />

  <rect x="332" y="252" width="252" height="352" rx="12" class="box" />
  <text x="350" y="282" class="lane">STRK20 POOL</text>
  <circle cx="356" cy="323" r="14" class="step"/><text x="356" y="327" class="step-text">4</text>
  <text x="380" y="320" class="head">Spend + invoke together</text>
  <rect x="350" y="352" width="216" height="76" rx="8" fill="#0F0F0F" stroke="#8B2F0C" />
  <text x="366" y="378" class="head accent">OPEN POSITION</text>
  <text x="366" y="400" class="copy">spend shielded STRK note</text>
  <text x="366" y="418" class="copy">InvokeExternal → Markets</text>
  <rect x="350" y="454" width="216" height="86" rx="8" fill="#0F0F0F" stroke="#8B2F0C" />
  <text x="366" y="480" class="head accent">SETTLE POSITION</text>
  <text x="366" y="502" class="copy">secret proves bearer claim</text>
  <text x="366" y="522" class="copy">payout returns as open note</text>
  <text x="350" y="575" class="copy bright">One v3 transaction per action</text>

  <rect x="630" y="252" width="252" height="352" rx="12" class="box" />
  <text x="648" y="282" class="lane">MARKETS + PRAGMA</text>
  <circle cx="654" cy="323" r="14" class="step"/><text x="654" y="327" class="step-text">5</text>
  <text x="678" y="320" class="head">Record public market data</text>
  <text x="648" y="354" class="copy">first bet: fresh Pragma line</text>
  <text x="648" y="374" class="copy">house float seeds other side</text>
  <text x="648" y="394" class="copy">constant-product tickets</text>
  <text x="648" y="414" class="copy">commitment, not bettor field</text>
  <rect x="648" y="448" width="216" height="104" rx="8" fill="#0F0F0F" stroke="#6B5F1B" />
  <text x="664" y="474" class="head warn">LIFECYCLE</text>
  <text x="664" y="496" class="copy">before close: cash out</text>
  <text x="664" y="516" class="copy">≤5m: anyone may resolve</text>
  <text x="664" y="536" class="copy">&gt;10m unresolved: anyone voids</text>
  <path d="M584 430H628" class="arrow" />

  <rect x="928" y="252" width="238" height="352" rx="12" class="box" />
  <text x="946" y="282" class="lane">POSITIONS + RECOVERY</text>
  <circle cx="952" cy="323" r="14" class="step"/><text x="952" y="327" class="step-text">6</text>
  <text x="976" y="320" class="head">Read by commitment</text>
  <text x="946" y="354" class="copy">browser secret stays local</text>
  <text x="946" y="374" class="copy">backup carries bearer record</text>
  <text x="946" y="394" class="copy">position screen reads state,</text>
  <text x="946" y="414" class="copy">cash-out and claim previews</text>
  <rect x="946" y="448" width="202" height="104" rx="8" fill="none" stroke="#8B2F0C" />
  <text x="962" y="474" class="head accent">TERMINAL OUTPUT</text>
  <text x="962" y="496" class="copy">cash-out before close</text>
  <text x="962" y="516" class="copy">winner: ticket payout</text>
  <text x="962" y="536" class="copy">void: cash-in refund</text>
  <path d="M882 430H926" class="public" />
  <path d="M946 550H906V584H584" class="arrow" />

  <rect x="34" y="630" width="1132" height="62" rx="10" fill="#111111" stroke="#343434" />
  <text x="52" y="656" class="head">IDENTITY BOUNDARY</text>
  <text x="52" y="678" class="copy">The contract stores a commitment instead of a bettor address. Identity protection depends on a crowd at the same public size.</text>
</svg>
