#
# The relayer's one host. `fly deploy` reads this; `Dockerfile` builds what it runs.
#
# FIRST, THE SECRETS THIS FILE DELIBERATELY DOES NOT CONTAIN. Set them once, before the first
# deploy, and never in `[env]` — everything in `[env]` is baked into the machine config and is
# readable by anyone who can run `fly config show`:
#
#   fly secrets set RELAYER_ADDRESS=0x… RELAYER_PRIVATE_KEY=0x… RELAYER_AUTH_TOKEN=$(openssl rand -hex 32)
#
# `RELAYER_AUTH_TOKEN` is not optional here. The moment this process is reachable through a proxy,
# every internet client arrives with no `Origin` header — the exact shape the other controls treat
# as a trusted same-process caller — and nothing warns you, because the off-host warning keys off
# `RELAYER_HOST`, which the Dockerfile set. The token is the only control that survives the hop.
# The browser never holds it: the app posts to its own origin and the proxy in front of this host
# adds the header server-side.
#
app = "passbook-relayer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Everything here is a fact about this deployment, not a secret. The three store paths point at
# the volume below; the Dockerfile sets the same values, and they are repeated here so that
# `fly config show` answers the question "where do the ledgers live" without anyone reading a
# layer.
[env]
  PORT = "8080"
  RELAYER_HOST = "0.0.0.0"
  # ONE JOURNEY MUST FIT, AND THIS CAP IS NOW A LIFETIME ONE. Every per-visitor allocation is
  # permanent (`ledger.ts` opens all four spend ledgers `lifetime`, keyed by `lifetimeVisitorId`),
  # so a connection gets its share once and never again.
  #
  # It stays level with the daily budget because the per-connection cap was never the control that
  # mattered, and sizing it tightly is actively dangerous now: MANY REAL PEOPLE SHARE ONE EGRESS
  # ADDRESS — carrier NAT, an office, a campus — and behind a proxy they can all arrive as one
  # visitor. A tight lifetime cap there is a permanent lockout for everybody, with nothing in a log
  # to say so. The controls that actually bound a person are per-ACCOUNT and already permanent: a
  # sponsored registration is metered per account (three, once), and the starting balance and the
  # drip are once-per-address claims that never come back. What is left is RELAYER_SPONSOR_DAILY —
  # OUR spending limit for the day, across everyone — and that is the honest brake, because it is a
  # fact about our wallet rather than a rule about a person.
  #
  # VERIFY `x-strk20-client-ip` FORWARDING FROM TWO NETWORKS before trusting a deployment. If the
  # proxy stops forwarding it, every user collapses into one visitor and the lockout is forever.
  RELAYER_SPONSOR_PER_VISITOR = "20"
  RELAYER_SPONSOR_STORE = "/data/sponsorship.json"
  RELAYER_SEND_STORE = "/data/send-budget.json"
  # The name directory is a PUBLIC ledger, and it was writing inside the container — so every
  # deploy silently dropped every claimed name while the two private ledgers beside it survived.
  # Found while verifying a README sentence that asserted it was durable. It is a public registry
  # people point other people at; losing it is worse than losing a cap, not better.
  RELAYER_DIRECTORY_STORE = "/data/directory.json"
  # The chain feed's price history. Not a ledger — losing it costs a chart its past, not anyone
  # a cap — but the volume is exactly where "the past this process witnessed" belongs.
  RELAYER_CHAIN_FEED_STORE = "/data/chain-feed.jsonl"
  # The Teller's tally-key ledger (signer five's custody, packages/relayer/src/teller.ts).
  # Losing it before a permanently-private close makes that vote untalliable — void_proposal is
  # the backstop, but the volume is where these keys belong. Idle until Governance deploys.
  RELAYER_TELLER_STORE = "/data/teller.json"
  # The faucet's once-per-address claim ledger. WITHOUT THIS on the volume, every deploy resets
  # the caps and re-opens the drip for every address ever funded. The faucet itself stays off
  # until `fly secrets set RELAYER_FAUCET=on` — flipping it spends real principal (M8: the drip
  # stakes the whole journey; the daily cap is the acquisition budget).
  RELAYER_FAUCET_STORE = "/data/faucet.json"
  # The starter's DAY budget, which it did not have until now. The once-per-account claims live in
  # the faucet ledger above and stay there; this file holds only the counters. WITHOUT IT on the
  # volume every deploy re-opens the day, which for a ~12 STRK gift is the expensive direction.
  #
  # The defaults (15/visitor LIFETIME, 25/day) are in `env.ts` and are a farm cap, not a ration:
  # 25 sits above RELAYER_SPONSOR_DAILY so an ordinary day is never refused by it. Retune with
  # RELAYER_STARTER_PER_VISITOR / RELAYER_STARTER_DAILY.
  RELAYER_STARTER_STORE = "/data/starter-budget.json"
  # The per-account sponsored allowance — the number the app shows counting down. On the volume
  # for the same reason as the others: without it every deploy hands every account a fresh three.
  RELAYER_ACCOUNT_STORE = "/data/account-allowance.json"
  # The hashes still awaiting a receipt, so the revert refund survives a deploy. Not a ledger —
  # losing it costs a refund nobody can see, never a cap. On the volume because a restart in the
  # thirty seconds after a broadcast is exactly when a watch is worth having.
  RELAYER_REVERT_WATCH_STORE = "/data/revert-watch.json"
  # After `deploy-governance.ts --execute`, set this to the blockNumber it prints — the Teller's
  # event-scan floor:
  #   fly secrets set RELAYER_GOVERNANCE_FROM_BLOCK=<block>

# The durable half of the process. Two spend ledgers and the salt that keys hashed visitor ids —
# lose them and every cap resets, which is the same as having no caps for whoever noticed.
#
# Create it once, in the app's region, before the first deploy:
#
#   fly volumes create relayer_data --region iad --size 1
#
[[mounts]]
  source = "relayer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # ONE MACHINE, ALWAYS ON. Three separate reasons, and each one alone is sufficient:
  #
  #   1. The chat rooms are in memory (`packages/relayer/src/rooms.ts`). Two machines means two
  #      halves of the same room, each fanning out to whoever landed on it, and a conversation
  #      where messages simply do not arrive — with nothing in any log to say why.
  #   2. The spend ledgers are files on ONE volume. A Fly volume attaches to a single machine, so
  #      a second machine either has no ledger or a different one.
  #   3. The funding monitor is a timer, not a request handler. A stopped machine stops watching
  #      the balance it is supposed to page about, and wakes up to sign with a number it read
  #      before it slept.
  #
  # A suspended machine also drops every open SSE stream, which for a chat surface reads as the
  # app being broken rather than as a host being thrifty.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # A funded signer answering an unbounded number of concurrent requests is a funded signer whose
  # rate limiting is somebody else's problem. The ceiling should be reached by an attack rather
  # than by a crowd — but "requests" COUNTS HELD STREAMS, and every open tab now legitimately
  # holds two (the room stream and the chain feed). 40 was reached by twenty browsers; these
  # numbers put the ceiling back where the argument wanted it, past any real crowd, while the
  # feed's own MAX_FEED_SUBSCRIBERS (256) and the room hub's caps stay the tighter, per-resource
  # refusals.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# An HTTP check against `/health`, which is the ONE route that answers an unauthenticated caller.
#
# This was a TCP check, because every other route sits behind `x-relayer-auth` and an
# unauthenticated HTTP probe gets a correct 401 that a health checker reads as a dead host — and
# putting the token in a check config would spread the secret to keep a green tick. That reasoning
# still holds for every other path; what changed is that there is now a public one, so the check can
# ask a real question instead of "is a socket open". A TCP check passes while the process cannot
# reach the chain and cannot pay a fee, which are the two ways this service actually fails.
#
# `/health` returns 200 whenever the process can serve, INCLUDING when it is out of STRK — a restart
# cannot add funds, so failing the check there would buy a restart loop that fixes nothing and takes
# the in-memory chat rooms down with it. Funding is reported in the body and paged by the monitor
# (`funding-monitor.ts`); it is deliberately not this check's business.
#
# The TCP check is kept alongside it: it catches a process wedged before the router is up, which an
# HTTP check on a 5 s timeout would report the same way but slower.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[services.tcp_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
