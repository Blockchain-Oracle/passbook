<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="strk20.run architecture">
<rect width="1200" height="680" fill="#0A0A0A"/>
<g transform="translate(36 30) scale(0.1286) translate(-116 -116)"><rect x="116" y="116" width="280" height="280" rx="60" fill="#C53603"/><g transform="translate(256 256) scale(0.45) translate(-256 -256)"><g transform="translate(-18 0)" fill="none" stroke="#F1F0EB" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"><line x1="336" y1="117.44" x2="176" y2="394.56"/><line x1="176" y1="117.44" x2="336" y2="394.56"/><line x1="96" y1="256" x2="452" y2="256"/><path d="M 394 198 L 452 256 L 394 314"/></g></g></g>
<text x="86" y="56" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#F1F0EB" letter-spacing="2">STRK20.RUN · HOW IT FITS TOGETHER</text>
<rect x="36" y="110" width="280" height="190" rx="10" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="52" y="140" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#F1F0EB" letter-spacing="1">YOUR BROWSER</text>
<text x="52" y="166" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#F1F0EB">embedded account key</text>
<text x="52" y="187" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">(localStorage, plaintext — stated)</text>
<text x="52" y="208" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">note discovery + two balances</text>
<text x="52" y="229" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">proofs built at latest − 10</text>
<text x="52" y="250" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">memo sealing / unsealing</text>
<text x="52" y="271" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#E04708">disclosure before every action</text>
<rect x="36" y="330" width="280" height="100" rx="10" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="52" y="360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#F1F0EB" letter-spacing="1">APP HOST</text>
<text x="52" y="386" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#F1F0EB">same-origin /api/* proxy</text>
<text x="52" y="407" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">injects the relayer token —</text>
<text x="52" y="428" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">the browser never holds it</text>
<rect x="420" y="210" width="300" height="190" rx="10" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="436" y="240" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#F1F0EB" letter-spacing="1">RELAYER  (one machine)</text>
<text x="436" y="266" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#F1F0EB">submits covered pool transactions</text>
<text x="436" y="287" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#F2DC4E">sees your IP + request timing</text>
<text x="436" y="308" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">routes Chat ciphertext + metadata</text>
<text x="436" y="329" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">never carries Mail</text>
<text x="436" y="350" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">(contract, entrypoint) allowlist</text>
<text x="436" y="371" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#A3A29C">STRK approve capped from live fee</text>
<rect x="824" y="96" width="340" height="472" rx="12" fill="none" stroke="rgba(240,239,234,0.14)"/>
<text x="840" y="126" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#F1F0EB" letter-spacing="2">STARKNET MAINNET</text>
<rect x="840" y="142" width="308" height="40" rx="8" fill="#151515" stroke="rgba(224,71,8,0.5)"/>
<text x="856" y="158" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#E04708">STRK20 POOL</text>
<text x="856" y="173" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">shielded notes live here</text>
<rect x="840" y="192" width="308" height="40" rx="8" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="856" y="208" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F1F0EB">MAILBOX (ours)</text>
<text x="856" y="223" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">sealed memo, posted by the pool</text>
<rect x="840" y="242" width="308" height="40" rx="8" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="856" y="258" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F1F0EB">VESUEARN (ours)</text>
<text x="856" y="273" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">USDC ↔ Vesu shares, pool-only</text>
<rect x="840" y="292" width="308" height="40" rx="8" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="856" y="308" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F1F0EB">MARKETS · LAUNCH (ours)</text>
<text x="856" y="323" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">bearer commitments, no buyer addr</text>
<rect x="840" y="342" width="308" height="40" rx="8" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="856" y="358" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#A3A29C">HOUSES (ours)</text>
<text x="856" y="373" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">readable; writes fail closed</text>
<rect x="840" y="392" width="308" height="40" rx="8" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="856" y="408" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F1F0EB">AVNU EXECUTOR</text>
<text x="856" y="423" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">swap inside the sandwich</text>
<rect x="840" y="442" width="308" height="40" rx="8" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="856" y="458" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F1F0EB">OUTBOUND ANONYMIZER</text>
<text x="856" y="473" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">bridge exit → CCTP, one way</text>
<rect x="840" y="492" width="308" height="40" rx="8" fill="#151515" stroke="rgba(240,239,234,0.14)"/>
<text x="856" y="508" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F1F0EB">PRAGMA ORACLE</text>
<text x="856" y="523" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C">free price reads, staleness shown</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E04708"/></marker></defs>
<line x1="176" y1="300" x2="176" y2="328" stroke="#E04708" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="196" y="320" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#E04708">pool writes + Chat rooms</text>
<line x1="316" y1="380" x2="418" y2="330" stroke="#E04708" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="367" y="350" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#E04708" text-anchor="middle">server token</text>
<line x1="720" y1="300" x2="822" y2="300" stroke="#E04708" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="770" y="284" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#E04708" text-anchor="middle">signed v3 invoke</text>
<text x="770" y="316" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#A3A29C" text-anchor="middle">proof rides as tx details</text>
<line x1="316" y1="150" x2="822" y2="150" stroke="#A3A29C" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ah)"/>
<text x="568" y="140" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#A3A29C" text-anchor="middle">free view reads over RPC — balances, compile_actions rehearsal, prices</text>
<line x1="1148" y1="460" x2="1188" y2="460" stroke="#F2DC4E" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="1156" y="448" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#F2DC4E" text-anchor="end">USDC out</text>
<rect x="420" y="440" width="300" height="128" rx="10" fill="none" stroke="rgba(224,71,8,0.35)"/>
<text x="436" y="468" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#E04708">THE INVOKE SANDWICH</text>
<text x="436" y="492" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#F1F0EB">withdraw input → venue executor</text>
<text x="436" y="511" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#F1F0EB">invoke the venue</text>
<text x="436" y="530" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#F1F0EB">proceeds land back as a note</text>
<text x="436" y="549" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A3A29C">no public address of yours between</text>
<rect x="36" y="612" width="14" height="14" fill="#E04708"/>
<text x="58" y="624" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A3A29C">shielded value</text>
<rect x="196" y="612" width="14" height="14" fill="#F2DC4E"/>
<text x="218" y="624" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A3A29C">public leg — amount visible</text>
<text x="470" y="624" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#A3A29C">deposits are public; what the pool hides is which notes are yours afterwards</text>
</svg>
