# The workspace: `packages/*` and `apps/*`.
packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 11 refuses every install script until each one is explicitly decided. `esbuild` links a
# native binary in its postinstall and is a real transitive dependency of the toolchain; without
# the build it resolves to a stub.
allowBuilds:
  esbuild: true

# Node ^24 is binding, not advisory: a wrong-major shell fails the install naming the range instead
# of installing anyway.
engineStrict: true

# Every dependency is pinned exactly; this stops `pnpm add` reintroducing a caret.
saveExact: true
